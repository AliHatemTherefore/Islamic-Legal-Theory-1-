<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102b27">
<title>The Usul al-Fiqh Challenge</title>
<style>
:root{--bg:#0b1716;--panel:#122522;--panel2:#19332e;--gold:#d9b86c;--cream:#f4ecd9;--muted:#b8c3b9;--green:#7bb69a;--red:#df8980;--line:#315047}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#1a3931 0,transparent 42%),var(--bg);color:var(--cream);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
button,input{font:inherit}button{cursor:pointer;border:0} .wrap{max-width:980px;margin:auto;padding:24px 18px 56px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:34px}
.brand{display:flex;gap:12px;align-items:center}.mark{width:42px;height:42px;border:1px solid var(--gold);border-radius:12px;display:grid;place-items:center;color:var(--gold);font-size:23px}
.brand strong{display:block;letter-spacing:.04em}.brand small{color:var(--muted)}
.pill{border:1px solid var(--line);border-radius:99px;padding:6px 11px;color:var(--muted);font-size:12px}
.hero{text-align:center;padding:34px 10px 28px}.eyebrow{color:var(--gold);letter-spacing:.2em;text-transform:uppercase;font-size:11px;font-weight:700}
h1{font-family:Georgia,serif;font-size:clamp(34px,6vw,58px);line-height:1.06;margin:13px 0;color:#fff4dc;font-weight:500}
.lead{color:var(--muted);max-width:620px;margin:0 auto 24px}
.panel{background:linear-gradient(145deg,rgba(25,51,46,.96),rgba(17,36,33,.96));border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 18px 50px #0003}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:22px 0}
.week{padding:19px;border-radius:15px;border:1px solid var(--line);background:#10221f;display:flex;flex-direction:column;gap:9px}
.week h3{font:22px Georgia,serif;margin:0}.week p{color:var(--muted);font-size:14px;margin:0;flex:1}
.btn{background:var(--gold);color:#18251f;padding:12px 18px;border-radius:10px;font-weight:750}
.btn.secondary{background:transparent;color:var(--cream);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:12px 0 18px}
.progress{height:7px;background:#29423b;border-radius:10px;overflow:hidden;margin:10px 0 22px}.bar{height:100%;background:var(--gold);width:0;transition:width .25s}
.qtop{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px}
h2{font:clamp(23px,4vw,31px) Georgia,serif;margin:18px 0 20px}
.options{display:grid;gap:10px}.opt{text-align:left;width:100%;padding:14px 16px;border-radius:12px;background:#0e201d;border:1px solid var(--line);color:var(--cream);transition:.15s}
.opt:hover{border-color:var(--gold);transform:translateY(-1px)}.opt.correct{border-color:var(--green);background:#17392f}.opt.wrong{border-color:var(--red);background:#3a2423}
.feedback{margin-top:17px;padding:15px;border-radius:12px;background:#0d201c;border:1px solid var(--line);color:var(--muted)}
.feedback b{color:var(--cream)}.hidden{display:none!important}
footer{margin-top:28px;color:#82968b;font-size:12px;text-align:center}
input{background:#0d201c;color:var(--cream);border:1px solid var(--line);border-radius:9px;padding:11px;width:100%;max-width:330px}
.admin{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}.admin summary{cursor:pointer;color:var(--gold)}
.note{font-size:13px;color:var(--muted)}.score{font:58px Georgia,serif;color:var(--gold)}
@media(max-width:600px){.wrap{padding:16px 13px 40px}.panel{padding:18px}header{margin-bottom:18px}}
</style></head>
<body><div class="wrap">
<header><div class="brand"><div class="mark">أ</div><div><strong>USŪL AL-FIQH</strong><small>Interactive learning challenge</small></div></div><span class="pill">COURSE EDITION · 01</span></header>
<main id="app"></main>
<footer>Built as an expandable course game · Add future weeks through the Week Manager</footer>
</div>
<script>
const DEFAULT_DATA = {"title": "The Usul al-Fiqh Challenge", "version": 1, "weeks": []};
const STORE_KEY = "usulFiqhWeeks_v1";
const MANIFEST_URL = "weeks-manifest.json";
let data = DEFAULT_DATA;
const app=document.getElementById("app");
let currentWeek=null, order=[], index=0, score=0, locked=false, player="";

// Fetch all published weeks from the manifest, merge with DEFAULT_DATA
async function loadPublishedWeeks() {
  try {
    const manifestRes = await fetch(MANIFEST_URL + "?_=" + Date.now());
    if (!manifestRes.ok) return;
    const manifest = await manifestRes.json();
    const weekFiles = manifest.weeks || [];
    const fetched = await Promise.all(
      weekFiles.map(f =>
        fetch(f + "?_=" + Date.now())
          .then(r => r.ok ? r.json() : null)
          .catch(() => null)
      )
    );
    for (const w of fetched) {
      if (!w || !w.id || !w.title || !Array.isArray(w.questions)) continue;
      const existing = data.weeks.findIndex(x => x.id === w.id);
      if (existing >= 0) data.weeks[existing] = w;
      else data.weeks.push(w);
    }
  } catch(e) { /* network unavailable, fall back to DEFAULT_DATA */ }
}

// Also merge any locally-imported extras saved in localStorage
try {
  const local = JSON.parse(localStorage.getItem(STORE_KEY));
  if (local && Array.isArray(local.weeks)) {
    for (const w of local.weeks) {
      if (!w || !w.id) continue;
      const existing = data.weeks.findIndex(x => x.id === w.id);
      if (existing < 0) data.weeks.push(w); // only add if not already published
    }
  }
} catch(e) {}
function save(){
  // Only save locally-added weeks (not the ones from published JSON files)
  localStorage.setItem(STORE_KEY,JSON.stringify(data));
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function home(){
 currentWeek=null;
 app.innerHTML=`<section class="hero"><div class="eyebrow">A guided journey through Islamic legal theory</div><h1>The Usul al-Fiqh<br>Challenge</h1><p class="lead">Test your understanding of the principles, terminology, scholarly approaches, and legal rulings of uṣūl al-fiqh.</p><span class="pill">LEARN · CHALLENGE · REVIEW</span></section>
 <section class="panel"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">Your course modules</div><h2 style="margin:7px 0">Choose a week</h2></div><span class="pill">${data.weeks.length} module${data.weeks.length===1?"":"s"}</span></div><div class="grid">${data.weeks.map((w,i)=>`<article class="week"><span class="eyebrow">MODULE ${i+1}</span><h3>${esc(w.title)}</h3><p>${esc(w.description||w.subtitle||"Course challenge")}</p><div class="row"><span class="pill">${(w.questions||[]).length} questions</span><button class="btn" onclick="startWeek('${esc(w.id)}')">Play module →</button></div></article>`).join("")}</div>
 <div class="note">Your progress is kept on this device. Scores are not shared between students unless you connect a shared leaderboard service.</div>
 <details class="admin"><summary>Week Manager · Add or import future weeks</summary><div style="padding-top:15px"><p class="note">To publish a new week to <b>all students</b>: add the week JSON file to your GitHub repo, then add its filename to <code>weeks-manifest.json</code> — it will appear for everyone after GitHub Pages rebuilds (usually ~1 min). Use the import below only for local preview/testing on your own device.</p><div class="row"><button class="btn secondary" onclick="downloadTemplate()">Download week template</button><button class="btn secondary" onclick="exportData()">Export all weeks</button><label class="btn secondary" for="importFile">Import week / course JSON</label><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(event)"></div><p id="adminMsg" class="note"></p></div></details>
 </section>`;
}
function startWeek(id){
 currentWeek=data.weeks.find(w=>w.id===id);if(!currentWeek)return;
 player="";order=currentWeek.questions.map((_,i)=>i).sort(()=>Math.random()-.5);index=0;score=0;locked=false;
 app.innerHTML=`<section class="hero"><div class="eyebrow">${esc(currentWeek.subtitle||"Course module")}</div><h1>${esc(currentWeek.title)}</h1><p class="lead">${esc(currentWeek.description||"Test your understanding.")}</p></section><section class="panel"><label class="note" for="player">Your name (optional)</label><p><input id="player" placeholder="Enter your name"></p><div class="stats"><span>${currentWeek.questions.length} questions</span><span>•</span><span>Mixed question types</span><span>•</span><span>Explanations included</span></div><button class="btn" onclick="begin()">Start challenge</button> <button class="btn secondary" onclick="home()">Back</button></section>`;
}
function begin(){player=document.getElementById("player").value.trim();renderQuestion();}
function renderQuestion(){
 locked=false;const q=currentWeek.questions[order[index]];
 const pct=(index/currentWeek.questions.length)*100;
 let body='';
 if(q.type==='short_answer'){
   body=`<div class="field-answer"><textarea id="writtenAnswer" rows="3" placeholder="Write your answer here…" style="width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#0d1d1a;color:var(--cream);font:inherit"></textarea><button class="btn" style="margin-top:12px" onclick="submitWritten()">Check answer</button></div>`;
 } else if(q.type==='table'){
   body=`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;margin:16px 0"><thead><tr><th style="text-align:left;padding:10px;border-bottom:1px solid var(--line)">Ruling</th><th style="padding:10px;border-bottom:1px solid var(--line)">If performed</th><th style="padding:10px;border-bottom:1px solid var(--line)">If not performed</th></tr></thead><tbody>${q.rows.map((r,i)=>`<tr><td style="padding:8px;border-bottom:1px solid var(--line)">${esc(r.label)}</td>${[0,1].map(j=>`<td style="padding:8px;border-bottom:1px solid var(--line)"><input id="cell-${i}-${j}" placeholder="Enter consequence" style="width:100%;min-width:115px;padding:9px;border-radius:8px;border:1px solid var(--line);background:#0d1d1a;color:var(--cream)"></td>`).join('')}</tr>`).join('')}</tbody></table></div><button class="btn" onclick="submitTable()">Check table</button>`;
 } else {
   const opts=q.options || ['True','False'];
   body=`<div class="options">${opts.map((o,i)=>`<button class="opt" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>`;
 }
 app.innerHTML=`<section class="panel"><div class="qtop"><span>${esc(currentWeek.title)}</span><span>QUESTION ${index+1} / ${currentWeek.questions.length}</span></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="stats"><span>⭐ Score: ${score}</span><span>${esc((q.type||'multiple_choice').replace('_',' '))}</span></div><h2>${esc(q.q)}</h2>${body}<div id="feedback" class="feedback hidden"></div><div class="row" style="justify-content:space-between;margin-top:20px"><button class="btn secondary" onclick="home()">Exit</button><button id="next" class="btn hidden" onclick="nextQuestion()">${index===currentWeek.questions.length-1?"See results":"Next question →"}</button></div></section>`;
}
function showFeedback(good,q,extra=''){
 if(good)score++;locked=true;
 const f=document.getElementById('feedback');f.classList.remove('hidden');
 f.innerHTML=`<b>${good?'Correct!':'Review this answer.'}</b><br>${extra?esc(extra)+'<br>':''}${esc(q.explanation||'Review the relevant section in your course material.')}<div class="note" style="margin-top:8px">Textbook reference: ${esc(q.pages||'See course material')}</div>`;
 document.getElementById('next').classList.remove('hidden');
}
function norm(s){return String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘']/g,"'").replace(/[^a-z0-9'\s-]/g,' ').replace(/\s+/g,' ').trim();}
function submitWritten(){
 if(locked)return;const q=currentWeek.questions[order[index]],v=document.getElementById('writtenAnswer').value.trim();
 const accepted=(q.acceptedAnswers||[q.answer]).filter(Boolean).map(norm);const good=accepted.includes(norm(v));
 document.getElementById('writtenAnswer').disabled=true;document.querySelector('.field-answer button').disabled=true;
 showFeedback(good,q,good?'Your answer was accepted.':'Suggested answer: '+(q.displayAnswer||q.answer));
}
function submitTable(){
 if(locked)return;const q=currentWeek.questions[order[index]];let all=true;let answers=[];
 q.rows.forEach((r,i)=>[0,1].forEach(j=>{const input=document.getElementById(`cell-${i}-${j}`);const val=input.value.trim();const accepted=(r.accepted[j]||[r.answers[j]]).map(norm);if(!accepted.includes(norm(val)))all=false;input.disabled=true;answers.push(`${r.label}: ${r.answers.join(' / ')}`);}));
 document.querySelectorAll('table input').forEach(x=>x.disabled=true);document.querySelector('section.panel > button.btn:not(.secondary)').disabled=true;
 showFeedback(all,q,all?'All table entries are correct.':'Reference table — '+answers.join('; '));
}
function answer(choice){
 if(locked)return;const q=currentWeek.questions[order[index]],buttons=[...document.querySelectorAll('.opt')];
 buttons.forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct');else if(i===choice)b.classList.add('wrong');});
 showFeedback(choice===q.answer,q,choice===q.answer?'':'Correct answer: '+(q.options||[])[q.answer]);
}
function nextQuestion(){index++;if(index>=currentWeek.questions.length)results();else renderQuestion();}
function results(){
 const total=currentWeek.questions.length,pct=Math.round(score/total*100);
 const label=pct>=90?"Excellent command of the material":pct>=75?"Strong work — keep refining":pct>=60?"Good progress — review missed concepts":"A useful first attempt — revisit the explanations";
 app.innerHTML=`<section class="hero"><div class="eyebrow">Challenge completed</div><h1>Well played${player?", "+esc(player):""}.</h1><div class="score">${score}<span style="font-size:25px;color:var(--muted)"> / ${total}</span></div><p class="lead">${pct}% correct · ${label}</p></section><section class="panel"><h2>Your result</h2><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="stats"><span>Correct: ${score}</span><span>Incorrect: ${total-score}</span><span>Module: ${esc(currentWeek.title)}</span></div><p class="note">This score is saved only in this session and on this device; it is not sent to an instructor or shared leaderboard.</p><div class="row"><button class="btn" onclick="startWeek('${esc(currentWeek.id)}')">Play again</button><button class="btn secondary" onclick="home()">Choose another week</button></div></section>`;
}
function download(name,content,type){const blob=new Blob([content],{type});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);}
function downloadTemplate(){
 const t={id:"week2",title:"Week 2 — Add your title",subtitle:"Topic · Topic · Topic",description:"A short description of this week's material.",source:"Textbook / lecture reference, pages xx–xx.",questions:[{q:"Write your question here",options:["Option A","Option B","Option C","Option D"],answer:0,explanation:"Explain why the answer is correct.",pages:"pp. xx–xx"}]};
 download("usul-week-template.json",JSON.stringify(t,null,2),"application/json");
}
function exportData(){download("usul-al-fiqh-course.json",JSON.stringify(data,null,2),"application/json");}
function importData(ev){
 const file=ev.target.files[0];if(!file)return;const reader=new FileReader();
 reader.onload=()=>{try{const obj=JSON.parse(reader.result);const incoming=Array.isArray(obj.weeks)?obj.weeks:[obj];for(const w of incoming){if(!w.id||!w.title||!Array.isArray(w.questions)||!w.questions.length)throw Error("Each week needs an id, title, and at least one question.");for(const q of w.questions){if(!q.q)throw Error("Every question needs question text.");if(!q.type||q.type==="multiple_choice"||q.type==="true_false"){if(!Array.isArray(q.options)||q.options.length<2||!Number.isInteger(q.answer)||q.answer<0||q.answer>=q.options.length)throw Error("A multiple-choice question has missing options or an invalid answer index.");}else if(q.type==="short_answer"){if(!q.answer&&!Array.isArray(q.acceptedAnswers))throw Error("A short-answer question needs an answer or acceptedAnswers.");}else if(q.type==="table"){if(!Array.isArray(q.rows)||!q.rows.length)throw Error("A table question needs rows.");}else throw Error("Unsupported question type: "+q.type);}const at=data.weeks.findIndex(x=>x.id===w.id);if(at>=0)data.weeks[at]=w;else data.weeks.push(w);}save();document.getElementById("adminMsg").textContent="Import successful. Your course now contains "+data.weeks.length+" week(s).";home();}catch(e){document.getElementById("adminMsg").textContent="Import failed: "+e.message;}};reader.readAsText(file);
}
// Show a loading state, then load published weeks, then render home
app.innerHTML = `<section class="hero"><p class="lead" style="margin-top:40px">Loading course modules…</p></section>`;
loadPublishedWeeks().then(() => home());
</script></body></html>
